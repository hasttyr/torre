<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta
      name="description"
      content="Torre Central Hub — gestión de torneos de ajedrez universitarios: inscripción, emparejamiento suizo, resultados y clasificación en tiempo real."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Torre Central Hub</title>
    <script>
      // Aplica el tema antes del primer paint para evitar el flash del tema
      // por defecto; stores/theme.ts usa la misma clave y lógica al montar.
      (function () {
        var theme = "dark";
        try {
          var guardado = localStorage.getItem("torre.theme");
          if (guardado === "light" || guardado === "dark") {
            theme = guardado;
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
        } catch (error) {
          // Sin acceso a localStorage/matchMedia (navegación privada, etc.): se usa 'dark'.
        }
        document.documentElement.dataset.theme = theme;
        // Same colors as stores/theme.ts (THEME_COLOR) and style.css (--bg).
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f7f5f0" : "#0f1115";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
